name: Import linked character artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/characters/sources.json'
      - 'scripts/import_character_art.py'
      - '.github/workflows/import-character-art.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: linked-character-art-import
  cancel-in-progress: false

jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests==2.32.5 pillow==11.3.0

      - name: Download and normalize linked art
        id: importer
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/import_character_art.py 2>&1 | tee assets/characters/import-log.txt

      - name: Commit generated files and diagnostics
        if: always()
        run: |
          git config user.name "odium-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/characters/normal assets/characters/hover assets/characters/detail assets/characters/import-log.txt
          if git diff --cached --quiet; then
            echo "No generated art or diagnostic changes."
            exit 0
          fi
          git commit -m "assets: import linked character artwork [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Fail if importer failed
        if: steps.importer.outcome == 'failure'
        run: exit 1
