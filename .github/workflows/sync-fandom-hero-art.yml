name: Sync Marvel Rivals character art

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_fandom_hero_art.py'
      - '.github/workflows/sync-fandom-hero-art.yml'

permissions:
  contents: write

concurrency:
  group: marvel-rivals-character-art
  cancel-in-progress: false

jobs:
  sync-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install image sync dependencies
        run: pip install requests==2.32.5 pillow==11.3.0
      - name: Cache roster cards and detail artwork
        run: python scripts/sync_fandom_hero_art.py
      - name: Commit character artwork
        run: |
          if git diff --quiet -- assets/characters; then
            echo "No character art change."
            exit 0
          fi
          git config user.name "odium-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/characters
          git commit -m "assets: cache roster and detail character artwork [skip ci]"
          git push
