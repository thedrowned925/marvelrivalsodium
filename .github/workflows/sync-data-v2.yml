name: Sync Marvel Rivals live data v2

# Manual trigger: 2026-08-27 23:07 TRT
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_data.py'
      - '.github/workflows/sync-data-v2.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odium-marvel-rivals-data-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 requests==2.32.5

      - name: Build summary and all character details
        run: |
          python scripts/sync_data.py \
            --url 'https://drive.google.com/uc?export=download&id=1POde_zwZb4P6pmAYn37towgVX9qTGDR8' \
            --output data/data.json \
            --details-dir data/characters
          echo "Generated detail files: $(find data/characters -type f -name '*.json' | wc -l)"
          test "$(find data/characters -type f -name '*.json' | wc -l)" -ge 54

      - name: Commit synchronized data
        run: |
          if git diff --quiet -- data/data.json data/characters; then
            echo 'Workbook data is already current on main.'
            exit 0
          fi
          git config user.name 'odium-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/data.json data/characters
          git commit -m 'data: publish full character details [skip ci]'

          # main may have advanced while the workbook was being processed.
          # Rebase the generated data commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish synchronized data to gh-pages
        run: |
          publish_dir="$(mktemp -d)"
          cp -a data/. "$publish_dir/"

          git fetch origin gh-pages
          git switch --detach origin/gh-pages

          rm -rf data
          mkdir -p data
          cp -a "$publish_dir"/. data/

          if git diff --quiet -- data; then
            echo 'Published gh-pages data is already current.'
            exit 0
          fi

          git config user.name 'odium-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          git commit -m 'data: publish tracker data to gh-pages'
          git push origin HEAD:gh-pages
