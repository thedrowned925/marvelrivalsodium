name: Sync Marvel Rivals live data v2

# A source-side notification skips the scheduled wait. Schedule remains a recovery fallback.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_data.py'
      - '.github/workflows/sync-data-v2.yml'
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [workbook-updated]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odium-marvel-rivals-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 requests==2.32.5

      - name: Build summary and all character details
        run: |
          python scripts/sync_data.py \
            --url 'https://drive.google.com/uc?export=download&id=1POde_zwZb4P6pmAYn37towgVX9qTGDR8' \
            --output data/data.json \
            --details-dir data/characters
          echo "Generated detail files: $(find data/characters -type f -name '*.json' | wc -l)"
          test "$(find data/characters -type f -name '*.json' | wc -l)" -ge 54

      - name: Commit synchronized data
        run: |
          if git diff --quiet -- data/data.json data/revision.json data/characters; then
            echo 'Workbook data is already current on main.'
            exit 0
          fi
          git config user.name 'odium-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/data.json data/revision.json data/characters
          git commit -m 'data: publish full character details [skip ci]'

          # main may have advanced while the workbook was being processed.
          # Rebase the generated data commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # Browsers read revision/summary/details from main. The page itself does not
      # need another deployment for each workbook edit.
