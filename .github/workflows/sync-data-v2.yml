name: Sync Marvel Rivals live data v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_data.py'
      - 'scripts/import_character_art.py'
      - 'assets/characters/sources.json'
      - '.github/workflows/sync-data-v2.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odium-marvel-rivals-data-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 requests==2.32.5 pillow==11.3.0

      - name: Build summary and all character details
        run: |
          python scripts/sync_data.py \
            --url 'https://drive.google.com/uc?export=download&id=1POde_zwZb4P6pmAYn37towgVX9qTGDR8' \
            --output data/data.json \
            --details-dir data/characters
          echo "Generated detail files: $(find data/characters -type f -name '*.json' | wc -l)"
          test "$(find data/characters -type f -name '*.json' | wc -l)" -ge 54

      - name: Import linked character artwork
        run: python scripts/import_character_art.py

      - name: Commit synchronized data and artwork
        run: |
          if git diff --quiet -- data/data.json data/characters assets/characters/normal assets/characters/hover assets/characters/detail; then
            echo 'Workbook data and character artwork are already current.'
            exit 0
          fi
          git config user.name 'odium-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/data.json data/characters assets/characters/normal assets/characters/hover assets/characters/detail
          git commit -m 'data: sync tracker data and linked character artwork [skip ci]'
          git push origin HEAD:main
